name: ci-build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Path: app/ByteBank.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore $env:Solution_Path

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild $env:Solution_Path /t:Rebuild /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      # Opcional — publicar binários como artefato
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ByteBank-${{ matrix.configuration }}
          path: app/**/bin/${{ matrix.configuration }}/
